<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1d1a16;--paper:#fbf6ea;--red:#d9412b;--red-dk:#7a1f12;--yel:#ffc21a;--navy:#1f3a68;--night:#1d2530;
  --disp:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
}
html{background:var(--night);touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;color:var(--paper);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;-webkit-tap-highlight-color:transparent;word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
body{overflow:hidden;background:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,canvas{touch-action:manipulation}
#gl{touch-action:none}
button{font-family:inherit;color:inherit;font-size:inherit;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#fx{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 95% at 50% 50%,transparent 60%,rgba(10,14,22,.45) 100%)}

.view{position:fixed;inset:0;z-index:10;height:100svh;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:max(58px,calc(env(safe-area-inset-top) + 52px)) 16px max(18px,calc(env(safe-area-inset-bottom) + 12px))}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:18px;letter-spacing:.04em;border:3px solid var(--ink);border-radius:16px;min-height:54px;padding:0 20px;cursor:pointer;width:100%;
  background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn.red{background:var(--red);color:#fff;font-size:21px;min-height:62px;text-shadow:0 2px 0 var(--red-dk)}
.btn.yel{background:var(--yel)}
.btn.ghost{background:rgba(29,26,22,.72);color:var(--paper);border-color:rgba(255,250,240,.55);box-shadow:none;font-size:16px;min-height:48px}
.row{display:flex;gap:10px;width:100%}
.row>.btn{flex:1;min-width:0}

#corner{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:40;display:flex;gap:8px}
#corner button{height:40px;min-width:44px;padding:0 10px;border-radius:12px;border:2px solid rgba(255,250,240,.5);background:rgba(29,26,22,.7);font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#corner svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* タイトル */
#vTitle{justify-content:space-between;gap:10px;pointer-events:none}
#vTitle button{pointer-events:auto}
.logo{text-align:center;line-height:1;position:relative;width:min(560px,100%);z-index:0}
.logo::before{content:'';position:absolute;inset:-22% -12%;z-index:-1;background:radial-gradient(closest-side,rgba(16,22,34,.82),rgba(16,22,34,0));pointer-events:none}
.logo .en{display:inline-block;font-family:"Zen Maru Gothic",var(--disp);font-weight:900;font-size:clamp(12px,3.4vw,16px);letter-spacing:.1em;color:var(--ink);background:var(--yel);padding:5px 12px 4px;border:3px solid var(--ink);transform:rotate(-3deg);box-shadow:3px 3px 0 var(--ink)}
.logo .main{display:block;margin-top:10px;font-family:var(--disp);font-size:min(13vw,7.6vh,76px);color:#fff;letter-spacing:.01em;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 0 26px rgba(255,194,26,.45)}
.logo .main b{color:var(--yel);font-weight:400}
html[lang=ja] .logo .main{font-family:"Zen Maru Gothic",var(--disp);font-weight:900;letter-spacing:.04em}
html[lang=ja] .logo .main b{font-family:"Zen Maru Gothic",var(--disp);font-weight:900}
.tBottom{width:min(520px,100%);display:flex;flex-direction:column;gap:10px}
.mc{display:flex;gap:10px;align-items:flex-start;width:100%}
.mc .face{flex:none;width:46px;height:46px}
.bubble{position:relative;flex:1;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:9px 12px;font-weight:700;font-size:14px;line-height:1.55}
.bubble small{display:block;font-size:11px;color:var(--red-dk);font-weight:900}
.bubble::before{content:"";position:absolute;left:-11px;top:14px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}

/* 遊び方 */
#vHow{justify-content:center;gap:14px}
.panel{width:min(560px,100%);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:16px 16px 14px;box-shadow:0 6px 0 var(--ink);min-height:0;overflow:hidden}
.panel h2{font-family:"Zen Maru Gothic",var(--disp);font-weight:900;font-size:22px;text-align:center;margin-bottom:10px}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;line-height:1.45}
.step svg{flex:none;width:46px;height:46px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:5px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.step b{color:var(--red-dk)}
#vHow .btn{width:min(560px,100%)}

/* プレイ（ゲージは置かない） */
#vPlay{padding:0;pointer-events:none}
.hudTop{position:absolute;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 112px 0 max(10px,env(safe-area-inset-left));display:flex;gap:8px;align-items:flex-start}
.stChip{flex:none;display:flex;align-items:center;gap:8px;background:rgba(29,26,22,.74);color:var(--paper);border:2px solid rgba(255,250,240,.45);border-radius:12px;padding:5px 10px}
.stChip b{font-family:var(--disp);font-weight:400;font-size:18px;line-height:1}
.stChip svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hint{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 50px);transform:translateX(-50%);max-width:calc(100% - 24px);background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:8px 14px;font-weight:900;font-size:16px;text-align:center;white-space:nowrap;animation:bob .6s ease-in-out infinite alternate;z-index:3}
@keyframes bob{to{transform:translate(-50%,-5px)}}
#finger{position:absolute;left:0;top:0;width:54px;height:54px;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));z-index:4;animation:tapf .8s ease-in-out infinite}
@keyframes tapf{50%{translate:0 8px}}
#finger svg{width:100%;height:100%}
/* 旗ボタン（操作はこれ1つ） */
#gBadge{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(22px,calc(env(safe-area-inset-bottom) + 14px));width:60px;height:80px;border-radius:5px;transform:rotate(-4deg);box-shadow:0 3px 8px rgba(0,0,0,.35);pointer-events:none}
#bFlag{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));width:112px;height:112px;border-radius:50%;border:4px solid var(--ink);background:var(--red);color:#fff;box-shadow:0 7px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;pointer-events:auto;touch-action:none;transition:background .12s}
#bFlag:active,#bFlag.press{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
#bFlag svg{width:56px;height:56px}
#bFlag .fc{fill:#fff;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
#bFlag .fp{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
#bFlag b{font-family:"Zen Maru Gothic",var(--disp);font-weight:900;font-size:19px;line-height:1;margin-top:-2px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
html[lang=en] #bFlag b{font-family:var(--disp);font-weight:400;font-size:17px}
#bFlag.go{background:#f4f1e8;color:var(--ink)}
#bFlag.go b{text-shadow:none}
#bFlag.go .fc{fill:#fff}
#bFlag:not(.go) .fc{fill:#ff6a52}
#bFlag.wave svg{animation:wave .5s ease-in-out infinite alternate;transform-origin:20% 90%}
@keyframes wave{from{rotate:-14deg}to{rotate:14deg}}
.qTag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;background:rgba(29,26,22,.82);color:var(--paper);border:2px solid rgba(255,250,240,.5);border-radius:99px;padding:3px 10px;font-family:var(--disp);font-weight:400;font-size:16px;white-space:nowrap;will-change:transform}
.qTag.hot{background:var(--red);border-color:var(--ink)}

/* 演出文字（3D の上） */
.ono{position:absolute;left:0;top:0;font-family:var(--disp);white-space:nowrap;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);will-change:transform,opacity}
.ono.red{color:#ff5a4e}.ono.yel{color:var(--yel)}
.sb{position:absolute;left:0;top:0;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:4px 10px;font-weight:900;font-size:15px;white-space:nowrap;will-change:transform,opacity}
.sb::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--ink);border-bottom:0}
.sb.hot{background:var(--red);color:#fff;font-size:18px}
.sb.warm{background:#ffe08a}
.sb.boss{background:var(--ink);color:var(--yel);border-color:var(--yel)}
.sb.radio{background:#dff2ff}
.sb.granny{pointer-events:auto;cursor:pointer;background:#fff4c2;font-size:16px;padding:6px 12px;text-align:center;line-height:1.3;animation:gpulse .7s ease-in-out infinite alternate}
.sb.granny small{display:block;font-size:12px;color:var(--red-dk)}
@keyframes gpulse{to{scale:1.06}}

/* 結果（給料明細） */
#vResult{background:rgba(12,16,24,.6);justify-content:center;gap:8px;padding-top:max(52px,calc(env(safe-area-inset-top) + 48px))}
.res{width:min(520px,100%);height:100%;min-height:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center}
#slip{flex:none;display:block;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.resSide{width:100%;display:flex;flex-direction:column;gap:8px;flex:none}
.res .row .btn{min-height:48px;font-size:16px;padding:0 10px;white-space:nowrap}
.btn.xpost{background:#000;color:#fff}
.btn svg.xlogo{fill:currentColor;stroke:none;width:20px;height:20px}
.reveal{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
.reveal.on{opacity:1;transform:none}
.more{display:flex;align-items:center;justify-content:center;gap:6px;align-self:center;min-height:40px;padding:0 14px;border:0;border-radius:99px;background:rgba(27,22,32,.6);color:var(--paper);font-weight:900;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.more svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#moreBox{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:rgba(10,14,22,.7)}
.moreP{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:8px 12px 12px}
.moreHd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.moreHd h2{font-family:"Zen Maru Gothic",var(--disp);font-weight:900;font-size:19px;padding-left:4px}
.moreX{flex:none;width:44px;height:44px;border:0;background:none;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.moreX svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round}
.moreL{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.moreL a{display:flex;flex-direction:column;min-width:0;background:#fff;color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.moreL img{display:block;width:100%;height:auto;aspect-ratio:1200/630;object-fit:cover;background:#e9e1cf;border-bottom:2px solid var(--ink)}
.moreL b{display:block;padding:5px 8px 0;font-size:14px;font-weight:900;line-height:1.3}
.moreL span{display:block;padding:2px 8px 7px;font-size:11px;font-weight:700;line-height:1.4;color:#5a4f4a}

@media (max-height:700px){
  .logo .main{font-size:min(12vw,6.8vh,62px)}
  .bubble{font-size:13px;padding:7px 10px;line-height:1.45}
  .btn{min-height:48px;font-size:16px}.btn.red{min-height:54px;font-size:19px}
  .step{font-size:13px}.step svg{width:40px;height:40px}
  #bFlag{width:96px;height:96px}#bFlag svg{width:46px;height:46px}
  .res .row .btn{min-height:44px;font-size:15px}
}
@media (max-height:560px) and (orientation:landscape){
  .view{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
  #vTitle{flex-direction:row;align-items:flex-end;justify-content:space-between;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  #vTitle .logo{width:44%;text-align:left;align-self:flex-start;margin-top:4px}
  .logo .main{font-size:min(6.6vw,13vh,58px)}
  .tBottom{width:min(380px,48%)}
  .mc .face{display:none}.bubble::before{display:none}
  #vHow{padding-top:max(52px,env(safe-area-inset-top))}
  .panel{padding:10px 14px}.panel h2{font-size:18px;margin-bottom:6px}
  .step{font-size:12.5px}.step svg{width:34px;height:34px}.steps{gap:6px}
  #vResult{padding-top:max(10px,env(safe-area-inset-top))}
  .res{width:min(760px,100%);flex-direction:row;align-items:center;gap:14px}
  .resSide{flex:0 0 auto;width:min(320px,44%);min-width:0}
  .res .row .btn{font-size:14px;gap:6px;padding:0 8px;min-height:44px}
  .res .row .btn svg{width:18px;height:18px}
  #bFlag{width:92px;height:92px;bottom:max(12px,env(safe-area-inset-bottom))}#bFlag svg{width:44px;height:44px}
  .hint{top:auto;bottom:max(12px,env(safe-area-inset-bottom));font-size:14px}
}
@media (min-width:900px) and (min-height:561px){ .res{width:min(900px,100%);flex-direction:row;align-items:center;gap:20px} .resSide{flex:0 0 auto;width:340px} }
#boot-err{position:fixed;inset:auto 8px 8px 8px;z-index:99;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px;border-radius:8px}
#loading{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;font-size:12px;font-weight:900;color:rgba(255,250,240,.75);pointer-events:none}
</style>

<body>
<canvas id="gl"></canvas>
<div id="vignette"></div>
<div id="fx"></div>
<div id="loading">loading…</div>

<div id="corner">
  <button id="bLang" type="button" aria-label="Language"><span id="langTxt">EN</span></button>
  <button id="bMute" type="button" aria-label="Sound">
    <svg id="icOn" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
    <svg id="icOff" viewBox="0 0 24 24" hidden><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
</div>

<main id="vTitle" class="view">
  <h1 class="logo"><span class="en" data-t="badge"></span><span class="main" data-t="logo"></span></h1>
  <div class="tBottom">
    <div class="mc"><svg class="face" viewBox="0 0 48 48"><circle cx="24" cy="27" r="17" fill="#f2c9a5" stroke="#1d1a16" stroke-width="3"/><path d="M6 22c0-14 36-14 36 0z" fill="#fff" stroke="#1d1a16" stroke-width="2.6"/><rect x="4" y="20" width="40" height="5" rx="2.5" fill="#fff" stroke="#1d1a16" stroke-width="2.4"/><path d="M20 9h8" stroke="#2a9d6f" stroke-width="3"/><path d="M15 29l5 1M33 29l-5 1" stroke="#1d1a16" stroke-width="2.6" stroke-linecap="round"/><path d="M18 37q6-3 12 0" fill="none" stroke="#1d1a16" stroke-width="2.6" stroke-linecap="round"/></svg><div class="bubble"><small data-t="bossName"></small><span data-t="lead"></span></div></div>
    <button class="btn red" id="bStart" type="button"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg><span data-t="start"></span></button>
    <div class="row"><button class="btn ghost" id="bHow" type="button" data-t="how"></button><button class="btn ghost" id="bMoreT" type="button" data-t="moreS"></button></div>
  </div>
</main>

<main id="vHow" class="view" hidden>
  <div class="panel">
    <h2 data-t="howT"></h2>
    <div class="steps">
      <div class="step"><svg viewBox="0 0 24 24"><path d="M6 3v18"/><path d="M7 4h11l-2.5 4L18 12H7z"/></svg><span data-t="how1"></span></div>
      <div class="step"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="7" height="6" rx="1.5"/><rect x="14" y="9" width="7" height="6" rx="1.5"/><path d="M10 7l2 2 2-2M10 17l2-2 2 2"/></svg><span data-t="how2"></span></div>
      <div class="step"><svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z"/><path d="M9 8l2 2-2 2M13 12h3"/></svg><span data-t="how3"></span></div>
    </div>
  </div>
  <button class="btn" id="bHowBack" type="button" data-t="back"></button>
</main>

<main id="vPlay" class="view" hidden>
  <div class="hudTop">
    <div class="stChip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b id="hClock">8:00</b></div>
  </div>
  <div class="hint" id="hint" hidden></div>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a,.sb')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
  document.addEventListener('contextmenu',function(e){e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__jtReady) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },7000);
})();
</script>
